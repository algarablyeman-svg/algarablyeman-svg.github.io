<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Join</title>
  </head>
  <body>
    <form action="" method="post">
      <fieldset>
        <legend>Join</legend>
        <div>
          <label for="name">Name:</label> <br />
          <input
            type="text"
            id="name"
            placeholder="Enter your name"
            name="name"
            required
          />
        </div>
        <br />
        <div>
          <label for="number">Phone Number:</label><br />
          <input
            type="number"
            id="number"
            name="number"
            placeholder="Enter your number"
            required
          />
        </div>
        <br />
        <div>
          <label for="email">Email:</label><br />
          <input
            type="email"
            id="email"
            name="email"
            placeholder="example@gmail.com"
            required
          />
        </div>
        <br />
        <div>
          <label for="age">ِِِAge:</label><br />
          <input
            type="number"
            id="age"
            name="age"
            placeholder="Enter your age"
          />
        </div>
        <br />
        <div>
          <label>Subscription:</label>
          <br />
          <label>
            <input
              type="radio"
              id="annual"
              name="Subscription"
              value="annual"
              required
            />annual</label
          >
          <br />
          <label>
            <input
              type="radio"
              id="monthly"
              name="Subscription"
              value="monthly"
              required
            />monthly</label
          >
        </div>

        <br />
        <div>
          <label>Preferred Time:</label>
          <br />
          <label>
            <input
              type="radio"
              id="morning"
              name="Preferred Time"
              value="morning"
              required
            />morning</label
          >
          <br />
          <label>
            <input
              type="radio"
              id="evening"
              name="Preferred Time"
              value="evening"
              required
            />evening</label
          >
        </div>
        <br />
        <div>
          <label for="bio">Bio:</label><br />
          <textarea name="bio" id="bio"></textarea>
        </div>
      </fieldset>
      <br />
      <div><button>Join the Queens Club 👑</button></div>
    </form>
  </body>
</html>
