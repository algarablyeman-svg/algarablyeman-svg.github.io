<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Personal Information</title>
    <link rel="stylesheet" href="Css/style.css" />
  </head>
  <body class="fancy">
    <form action="" method="post" class="form">
      <fieldset>
        <legend class="title">Personal Information</legend>
        <img class="img" src="images/20241219_153139.jpg" alt="" height="200" />
        <div class="name">
          <label for="name" class="for">Name:</label>
          <input
            class="hero"
            type="text"
            id="name"
            name="name"
            placeholder="Enter Your name"
            required
          />
        </div>
        <br />
        <div class="name">
          <label for="position" class="for">Position:</label>
          <input
            class="hero"
            type="position"
            id="position"
            name="position"
            placeholder="Enter Your position"
            required
          />
        </div>
        <br />
        <div class="name">
          <label for="desc" class="for">Description:</label>
          <input
            class="hero"
            type="desc"
            id="desc"
            name="desc"
            placeholder="Enter Your Description"
            required
          />
        </div>
        <br />
        <div class="buttons">
          <button class="Submit">Submit</button>
          <button class="Reset">Reset</button>
        </div>
      </fieldset>
    </form>
  </body>
</html>
